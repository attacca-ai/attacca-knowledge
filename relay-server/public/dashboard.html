<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attacca · Research Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<style>
:root {
  --bg:#08090b;
  --surface:#0f1013;
  --surface-2:#141519;
  --surface-3:#1a1c21;
  --border:#22252c;
  --border-subtle:#191b20;
  --text-primary:#d8dae0;
  --text-secondary:#616570;
  --text-muted:#3a3d45;
  --accent:#4f6ef5;
  --accent-dim:rgba(79,110,245,.1);
  --green:#3da876;
  --green-dim:rgba(61,168,118,.1);
  --green-bright:#4caf82;
  --red:#c95454;
  --red-dim:rgba(201,84,84,.08);
  --yellow:#b8923a;
  --yellow-dim:rgba(184,146,58,.1);
  --yellow-bright:#d4a843;
  --purple:#7b5ea7;
  --purple-dim:rgba(123,94,167,.1);
  --orange:#c4763a;
  --orange-dim:rgba(196,118,58,.1);
  --font-sans:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);font-size:12px;line-height:1.5}

/* LAYOUT */
.shell{display:flex;height:100vh;overflow:hidden}

/* LEFT NAV */
.nav{
  width:200px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;padding:0;overflow:hidden;
}
.nav-header{padding:18px 18px 14px;border-bottom:1px solid var(--border-subtle)}
.nav-logo{font-family:var(--font-mono);font-size:11px;color:var(--text-primary);letter-spacing:.06em;margin-bottom:2px}
.nav-sub{font-size:10px;color:var(--text-muted)}

.nav-section{padding:12px 10px 4px}
.nav-section-label{
  font-family:var(--font-mono);font-size:8px;color:var(--text-muted);
  letter-spacing:.12em;text-transform:uppercase;padding:0 8px;margin-bottom:4px;
}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  border-radius:4px;cursor:pointer;color:var(--text-secondary);font-size:11.5px;
  transition:all .1s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text-primary)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0}
.nav-item.active .nav-dot{opacity:1}

.nav-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border-subtle)}
.nav-auth{background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:4px;padding:8px 10px}
.nav-auth-label{font-size:10px;color:var(--text-muted);margin-bottom:4px;font-family:var(--font-mono)}
.nav-auth-input{
  width:100%;background:transparent;border:none;
  font-family:var(--font-mono);font-size:10px;color:var(--text-primary);
  outline:none;letter-spacing:.08em;
}
.nav-auth-btn{
  width:100%;margin-top:6px;padding:5px;background:var(--accent);
  border:none;border-radius:3px;color:#fff;font-family:var(--font-mono);
  font-size:9px;cursor:pointer;letter-spacing:.06em;transition:opacity .12s;
}
.nav-auth-btn:hover{opacity:.85}
.nav-period{margin-top:8px;display:flex;gap:4px}
.period-btn{
  flex:1;padding:4px;background:transparent;
  border:1px solid var(--border);border-radius:3px;
  color:var(--text-muted);font-family:var(--font-mono);font-size:8px;
  cursor:pointer;text-align:center;letter-spacing:.04em;transition:all .1s;
}
.period-btn:hover{border-color:var(--accent);color:var(--accent)}
.period-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* MAIN CONTENT */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOP BAR */
.topbar{
  height:44px;flex-shrink:0;
  border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;padding:0 20px;gap:12px;
  background:var(--surface);
}
.topbar-title{font-size:12.5px;font-weight:500;color:var(--text-primary)}
.topbar-sep{width:1px;height:16px;background:var(--border)}
.topbar-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}
.topbar-badge{
  font-family:var(--font-mono);font-size:8px;padding:2px 7px;
  border-radius:10px;display:flex;align-items:center;gap:4px;
}
.topbar-badge.connected{background:var(--green-dim);color:var(--green-bright)}
.topbar-badge.offline{background:rgba(74,77,85,.12);color:var(--text-muted)}
.live-dot{width:4px;height:4px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar-right{margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}

/* GRID */
.grid-scroll{
  flex:1;overflow-y:auto;padding:16px 20px;
  display:flex;flex-direction:column;gap:14px;
}
.grid-scroll::-webkit-scrollbar{width:4px}
.grid-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.grid-row{display:grid;gap:12px}
.row-4{grid-template-columns:repeat(4,1fr)}
.row-3{grid-template-columns:repeat(3,1fr)}
.row-2{grid-template-columns:repeat(2,1fr)}
.row-2-1{grid-template-columns:2fr 1fr}

/* SECTION LABEL */
.section-label{
  font-family:var(--font-mono);font-size:8.5px;color:var(--text-muted);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px;
  display:flex;align-items:center;gap:8px;padding-top:4px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border-subtle)}

/* CARD */
.card{
  background:var(--surface);border:1px solid var(--border-subtle);
  border-radius:8px;padding:14px 16px;
  display:flex;flex-direction:column;gap:0;
}
.card-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:12px;
}
.card-title{
  font-family:var(--font-mono);font-size:9px;color:var(--text-muted);
  letter-spacing:.1em;text-transform:uppercase;
}
.card-badge{font-family:var(--font-mono);font-size:8px;padding:1px 6px;border-radius:3px}
.cb-green{background:var(--green-dim);color:var(--green-bright)}
.cb-yellow{background:var(--yellow-dim);color:var(--yellow-bright)}
.cb-red{background:var(--red-dim);color:var(--red)}
.cb-blue{background:var(--accent-dim);color:var(--accent)}
.cb-purple{background:var(--purple-dim);color:var(--purple)}
.cb-orange{background:var(--orange-dim);color:var(--orange)}

/* BIG NUMBER */
.big-num{font-family:var(--font-mono);font-size:28px;font-weight:300;color:var(--text-primary);line-height:1;margin-bottom:3px}
.big-num-sub{font-size:11px;color:var(--text-secondary);line-height:1.4}

/* MINI BAR CHART */
.mini-bars{display:flex;align-items:flex-end;gap:2px;height:36px;margin-top:8px}
.mbar{flex:1;border-radius:1px 1px 0 0;min-height:2px;transition:height .3s}
.mbar-accent{background:var(--accent);opacity:.7}
.mbar-green{background:var(--green);opacity:.7}
.mbar-yellow{background:var(--yellow);opacity:.7}
.mbar-label-row{
  display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:7.5px;color:var(--text-muted);margin-top:3px;
}

/* HORIZONTAL BAR */
.h-bar-track{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin:4px 0}
.h-bar-fill{height:100%;border-radius:2px;transition:width .5s}

/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  font-family:var(--font-mono);font-size:8px;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.1em;padding:0 0 8px;
  text-align:left;font-weight:400;border-bottom:1px solid var(--border-subtle);
}
.data-table th:not(:first-child){text-align:right}
.data-table td{
  padding:7px 0;font-size:11.5px;color:var(--text-secondary);
  border-bottom:1px solid var(--border-subtle);vertical-align:middle;
}
.data-table td:not(:first-child){text-align:right;font-family:var(--font-mono);font-size:10.5px}
.data-table tr:last-child td{border-bottom:none}
.td-primary{color:var(--text-primary)!important}
.td-green{color:var(--green-bright)!important}
.td-yellow{color:var(--yellow-bright)!important}
.td-red{color:var(--red)!important}
.td-muted{color:var(--text-muted)!important}

/* TRUST DISTRIBUTION */
.trust-dist{display:flex;flex-direction:column;gap:8px}
.td-row{display:flex;align-items:center;gap:8px}
.td-label{font-size:11.5px;color:var(--text-secondary);width:88px;flex-shrink:0}
.td-bar-wrap{flex:1;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.td-bar{height:100%;border-radius:3px;transition:width .5s}
.td-val{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:36px;text-align:right;flex-shrink:0}
.tdb-cautious{background:var(--green)}
.tdb-balanced{background:var(--accent)}
.tdb-autonomous{background:var(--orange)}

/* INSIGHT CALLOUT */
.insight{
  background:var(--surface-2);border-left:2px solid var(--accent);
  border-radius:0 5px 5px 0;padding:8px 12px;margin-top:10px;
  font-size:11.5px;color:var(--text-secondary);line-height:1.5;
}
.insight strong{color:var(--text-primary);font-weight:500}
.insight em{color:var(--accent);font-style:normal}

/* LOADING / ERROR */
.state-msg{
  display:flex;align-items:center;justify-content:center;
  height:100%;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);
  flex-direction:column;gap:12px;
}
.state-msg.error{color:var(--red)}
</style>
</head>
<body>
<div class="shell">

  <!-- NAV -->
  <div class="nav">
    <div class="nav-header">
      <div class="nav-logo">attacca</div>
      <div class="nav-sub">research · internal</div>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">Views</div>
      <div class="nav-item active"><div class="nav-dot"></div>Overview</div>
      <div class="nav-item"><div class="nav-dot"></div>Trust Calibration</div>
      <div class="nav-item"><div class="nav-dot"></div>Workflow Fit</div>
      <div class="nav-item"><div class="nav-dot"></div>Permission Patterns</div>
    </div>

    <div class="nav-bottom">
      <div class="nav-auth">
        <div class="nav-auth-label">DASHBOARD SECRET</div>
        <input class="nav-auth-input" id="secret" type="password" placeholder="enter secret…">
        <button class="nav-auth-btn" id="load-btn">LOAD DATA</button>
      </div>
      <div class="nav-period">
        <button class="period-btn" data-period="7">7d</button>
        <button class="period-btn active" data-period="30">30d</button>
        <button class="period-btn" data-period="90">90d</button>
        <button class="period-btn" data-period="0">all</button>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="topbar">
      <div class="topbar-title">Attacca Research Dashboard</div>
      <div class="topbar-sep"></div>
      <div class="topbar-meta" id="topbar-meta">internal · not for distribution</div>
      <div class="topbar-badge offline" id="relay-badge">
        <div class="live-dot"></div>
        <span id="relay-label">loading…</span>
      </div>
      <div class="topbar-right" id="topbar-right">—</div>
    </div>

    <div class="grid-scroll" id="grid">
      <div class="state-msg">
        <span>Enter dashboard secret and click LOAD DATA</span>
      </div>
    </div>
  </div>

</div>
<script src="dashboard.js"></script>
</body>
</html>
